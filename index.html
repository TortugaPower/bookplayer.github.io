<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BookPlayer</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
	<style>
		* {
			margin: 0;
			padding: 0;
			border: 0;
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: grid;
			align-content: center;
			justify-content: center;
			overflow: auto;
			background: #fff;
			font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			padding: 24px;
		}

		.card {
			width: 380px;
			max-width: 100%;
			padding: 40px 28px 28px;
			border: 1px solid #e5e5e7;
			border-radius: 20px;
			text-align: center;
		}

		.logo {
			width: 200px;
			height: 200px;
		}

		.wordmark {
			margin-top: 16px;
			font-size: 40px;
			font-weight: 300;
			color: #232a7a;
		}

		.badges {
			margin-top: 28px;
			display: flex;
			gap: 16px;
			justify-content: center;
			align-items: flex-start;
			flex-wrap: wrap;
		}

		.store {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 10px;
		}

		.badge-official {
			height: 44px;
			width: auto;
			display: block;
		}

		.source {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-size: 13px;
			color: #8e8e93;
			text-decoration: none;
		}

		.source .gh-icon {
			width: 15px;
			height: 15px;
		}

		.source:hover span {
			text-decoration: underline;
		}

		.legal {
			margin-top: 24px;
			font-size: 13px;
			color: #8e8e93;
		}

		.legal a {
			color: #8e8e93;
			text-decoration: none;
		}

		.legal a:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<main class="card">
		<img class="logo" src="logo.png" width="200" height="200" alt="BookPlayer logo">
		<h1 class="wordmark">BookPlayer</h1>
		<div class="badges">
			<div class="store">
				<a href="https://apps.apple.com/app/id1138219998" aria-label="Download BookPlayer on the App Store">
					<img class="badge-official" src="appstore-badge.svg" alt="Download on the App Store">
				</a>
				<a class="source" href="https://github.com/TortugaPower/BookPlayer">
					<svg class="gh-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
					<span>Source</span>
				</a>
			</div>
			<div class="store">
				<a href="https://play.google.com/store/apps/details?id=com.tortugapower.audiobookplayer" aria-label="Get BookPlayer on Google Play">
					<img class="badge-official" src="googleplay-badge.svg" alt="Get it on Google Play">
				</a>
				<a class="source" href="https://github.com/TortugaPower/bookplayer-android">
					<svg class="gh-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
					<span>Source</span>
				</a>
			</div>
		</div>
		<p class="legal"><a href="/privacy/">Privacy Policy</a> &middot; <a href="/terms/">Terms of Use</a></p>
	</main>
</body>
</html>
